name: EUHNN release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build exact tagged source
        run: |
          python -m pip install build==1.6.1 hatchling==1.32.0 twine==7.0.0
          python -m build
          python -m twine check dist/*
          python -c "import pathlib,tomllib,os; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v'+v"
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* audit/final-validation.json \
            --verify-tag --title "EUHNN ${GITHUB_REF_NAME#v}" \
            --generate-notes

